[build]
  publish = "."
  functions = "netlify/functions"
  # Hoppa över publicering när bara innehållsfilerna ändrats (de läses direkt från GitHub via /api/innehall).
  # Exit 0 = hoppa över, 1 = publicera. Sparar Netlify-krediter.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)nyheter.json' ':(exclude)podd.json' ':(exclude)poll.json' ':(exclude)README.md'"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
