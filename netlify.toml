[build]
  publish = "."
  functions = "netlify/functions"
  # Hoppa över publicering när bara innehållsfilerna ändrats (de läses direkt från GitHub via /api/innehall).
  # Exit 0 = hoppa över, 1 = publicera. Sparar Netlify-krediter.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)nyheter.json' ':(exclude)podd.json' ':(exclude)poll.json' ':(exclude)leasing.json' ':(exclude)README.md'"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Samla all trafik på en adress (bra för Google): www -> utan www
[[redirects]]
  from = "https://www.alriksbilar.se/*"
  to = "https://alriksbilar.se/:splat"
  status = 301
  force = true
